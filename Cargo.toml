[package]
name = "mcp-hookd"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "Webhook subscription, verification, ingest, and delivery daemon for MCP Events"
repository = "https://github.com/ImoutoHeaven/mcp-hookd"
readme = "README.md"

[dependencies]
base64 = "0.22"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
getrandom = "0.3"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "native-tokio"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy", "http1", "service"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12", "std"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.11.1"
subtle = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-std", "io-util", "fs"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-service = "0.3"
url = "2.5"
zeroize = { version = "1.8", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_Threading"] }

[dev-dependencies]
rcgen = "0.13"
tempfile = "3"

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
